# P0/P2 foundation: PostgreSQL only. Backend/frontend services are added in P11.
# NOTE: not executed in the P0 build environment (no Docker available). Credentials come from the environment.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gamis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment}
      POSTGRES_DB: ${POSTGRES_DB:-gamis}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gamis_pgdata:/var/lib/postgresql/data
volumes:
  gamis_pgdata:
