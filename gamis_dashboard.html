<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAMIS Dashboard</title>
<style>
:root{--bg:#FAF9F6;--surface:#fff;--soft:#F8FAFC;--line:#E2E8F0;--line2:#CBD5E1;--text:#0F172A;--muted:#475569;--faint:#64748B;--teal:#0F766E;--teal-bg:#E6F2F0;--blue:#2563EB;--blue-bg:#E8EFFD;--green:#27856A;--green-bg:#E5F2ED;--amber:#9A6700;--amber-bg:#FDF1D6;--red:#C45B61;--red-bg:#F8E7E8;--slate-bg:#EEF2F6;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
aside{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 18px}.mark{width:34px;height:34px;border-radius:8px;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700}
.brand b{display:block;font-size:15px}.brand small{color:var(--faint);font-size:11px}
nav button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;padding:8px 10px;border-radius:6px;color:var(--muted);cursor:pointer;text-align:left;font-weight:500}
nav button:hover{background:var(--slate-bg);color:var(--text)}nav button.on{background:var(--teal-bg);color:var(--teal);font-weight:600}
.side-foot{margin-top:auto;border:1px solid var(--line);border-radius:9px;padding:10px;background:var(--soft);font-size:12px;color:var(--muted)}.side-foot b{display:block;color:var(--text)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--amber)}.dot.live{background:var(--green)}
main{min-width:0}header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
header.top h1{margin:0;font-size:22px;line-height:30px}header.top p{margin:0;color:var(--muted);font-size:13px}
.wrap{padding:24px 28px 48px;display:grid;gap:18px}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.split{grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr)}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap}nav{display:flex;flex-wrap:wrap}.side-foot{display:none}.split{grid-template-columns:1fr}.wrap,header.top{padding-left:16px;padding-right:16px}}
@media(max-width:500px){.g2{grid-template-columns:1fr}.card{padding:12px}nav button{width:auto}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}.card h2{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi small{color:var(--faint);font-size:12px}.kpi b{display:block;font-size:26px;line-height:34px}.kpi span{font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;border-radius:5px;padding:2px 8px;font:600 11px/16px var(--mono);background:var(--slate-bg);color:var(--muted);white-space:nowrap}
.b-green{background:var(--green-bg);color:var(--green)}.b-red{background:var(--red-bg);color:#A23E44}.b-amber{background:var(--amber-bg);color:var(--amber)}.b-blue{background:var(--blue-bg);color:var(--blue)}.b-teal{background:var(--teal-bg);color:var(--teal)}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:7px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer}.btn:hover{background:var(--slate-bg)}.btn.p{background:var(--teal);border-color:var(--teal);color:#fff}.btn.p:hover{background:#0B5F58}.btn.d{color:#A23E44;border-color:#E3B4B7}.btn.sm{padding:4px 9px;font-size:12px}.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--faint);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tbody tr.pick{cursor:pointer}tbody tr.pick:hover{background:var(--soft)}tr.sel{background:var(--teal-bg)}.scroll{overflow-x:auto}.mono{font-family:var(--mono);font-size:12px}
.bar{height:8px;border-radius:4px;background:var(--slate-bg);overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}.bar.warn i{background:var(--amber)}.bar.bad i{background:var(--red)}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:0;padding:0;list-style:none}.stages li{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--soft);font-size:12px}.stages li b{display:block;font-size:13px}
label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}input,select,textarea{border:1px solid var(--line2);border-radius:7px;padding:7px 10px;background:#fff;width:100%}textarea{font:12px/1.5 var(--mono);min-height:110px}
.form{display:grid;gap:10px}.f2{grid-template-columns:1fr 1fr}pre{margin:0;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.5 var(--mono);overflow:auto;white-space:pre-wrap;word-break:break-all}
.note{border:1px solid #EBD38B;background:var(--amber-bg);color:#6B4A00;border-radius:9px;padding:10px 12px;font-size:13px}.note.ok{border-color:#BBDCCF;background:var(--green-bg);color:#1B5E49}.note.bad{border-color:#E3B4B7;background:var(--red-bg);color:#8A3036}
.muted{color:var(--muted)}.faint{color:var(--faint)}.empty{padding:18px;color:var(--muted);text-align:center}.stack{display:grid;gap:10px}.split2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wrap-any{overflow-wrap:anywhere}
.toast{position:fixed;right:20px;bottom:20px;background:var(--text);color:#fff;padding:10px 14px;border-radius:8px;z-index:10;max-width:380px;display:none}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="brand"><div class="mark">G</div><div><b>GAMIS</b><small>Governed intelligence</small></div></div>
  <nav id="nav"></nav>
  <div class="side-foot"><b id="sf-title"></b><span id="sf-sub"></span></div>
</aside>
<main>
  <header class="top"><div><h1 id="h1"></h1><p id="h1p"></p></div><div class="row" id="topbar"></div></header>
  <div class="wrap" id="view"></div>
</main>
</div>
<script>
const API={health:'/health',missions:'/api/missions',agents:'/api/agents',models:'/api/models',approvals:'/api/approvals',evidence:'/api/evidence',ledger:'/api/ledger',verify:'/api/ledger/verify',scenarios:'/api/evaluation/scenarios'};
const defaultBase=location.protocol==='http:'||location.protocol==='https:'?location.origin:'http://127.0.0.1:8000';
const cfg=(()=>{try{return Object.assign({base:defaultBase},JSON.parse(localStorage.getItem('gamis_cfg')||'{}'))}catch(_){return {base:defaultBase}}})();
const PAGES=[['mission','Mission Control','Live mission status, submission, progress, and budget'],['agents','Agent Monitor','Registered workers, assignments, and task progress'],['gateway','Gateway Console','Read-only Secure Tool Gateway decisions and receipts'],['approvals','Approval Center','Approval capability reported by this runtime'],['evidence','Evidence Explorer','Persisted evidence, integrity, and provenance'],['audit','Audit Explorer','Append-only audit events and ledger verification'],['security','Security Evaluation','Supported evaluation scenario definitions'],['conn','Connection','Backend URL and live connection status']];
const S={page:'mission',connected:false,health:null,error:'',errors:{},missions:[],agents:[],evidence:[],ledger:[],scenarios:[],approvals:null,selectedMission:'',detail:null,tasks:[],report:null,gateway:null,recovery:null,verify:null,models:null,providerTouched:false,form:{objective:'Investigate suspicious network events and determine whether the available evidence supports a security incident.',provider:'mock',supervisor:'',research:'',analysis:'',verification:''},selectedEvidence:'',selectedEvent:null,filter:{evidence:'',ledger:''},loading:false,lastUpdated:null};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=s=>s?String(s).slice(0,10)+'…': '—';
const fmt=s=>s?String(s).replace('T',' ').replace(/\.\d+/,'').replace('Z',' UTC'):'—';
const json=x=>JSON.stringify(x,null,2);
const badge=(s,c)=>`<span class="badge ${c||statusClass(s)}">${esc(s||'UNKNOWN')}</span>`;
function statusClass(s){s=String(s||'').toUpperCase();if(['COMPLETE','COMPLETED','VERIFIED','ACTIVE','IDLE','PASSED','OK'].includes(s))return'b-green';if(['FAILED','REVOKED','DENIED','UNCERTAIN','CANCELLED'].includes(s))return'b-red';if(['RUNNING','QUEUED','PARTIAL','PENDING','INTERRUPTED','SUSPENDED'].includes(s))return'b-amber';return'b-blue'}
function apiError(payload,status){const detail=payload?.error||payload?.detail;const msg=typeof detail==='string'?detail:(detail?.message||JSON.stringify(detail||payload||{}));const code=detail?.code?`${detail.code}: `:'';return new Error(`${code}${msg} (HTTP ${status})`)}
async function api(path,options={}){if(!cfg.base)throw new Error('Set the local API base URL on Connection.');let response;try{response=await fetch(cfg.base.replace(/\/+$/,'')+path,{method:options.method||'GET',headers:{'Content-Type':'application/json'},body:options.body===undefined?undefined:JSON.stringify(options.body)})}catch(e){throw new Error(`Could not reach ${cfg.base}: ${e.message}`)}let body;try{body=await response.json()}catch(_){body={}}if(!response.ok)throw apiError(body,response.status);return body}
function setError(key,error){S.errors[key]=error?error.message||String(error):''}
async function loadSection(key,path,assign){try{const result=await api(path);assign(result);setError(key,null)}catch(e){setError(key,e)}}
async function loadModels(){if(!S.connected)return;try{S.models=await api('/api/models?provider='+encodeURIComponent(S.form.provider));setError('models',null);const a=S.models.available_models||[];if(a.length){for(const k of ['supervisor','research','analysis','verification'])if(!a.includes(S.form[k]))S.form[k]=a.includes(S.models.configured_models?.[k])?S.models.configured_models[k]:a[0]}}catch(e){S.models=null;setError('models',e)}render()}
async function loadSelected(){const id=S.selectedMission;if(!id){S.detail=S.report=S.gateway=S.recovery=null;S.tasks=[];return}const q=encodeURIComponent(id);const tasks=api(`/api/missions/${q}/tasks`),detail=api(`/api/missions/${q}`),recovery=api(`/api/missions/${q}/recovery`),gateway=api(`/api/missions/${q}/gateway`);const results=await Promise.allSettled([detail,tasks,recovery,gateway]);const keys=['detail','tasks','recovery','gateway'];results.forEach((r,i)=>{if(r.status==='fulfilled'){const v=r.value;if(keys[i]==='tasks')S.tasks=v.tasks||[];else S[keys[i]]=v;setError(keys[i],null)}else setError(keys[i],r.reason)});if(S.detail?.report_ready){try{const r=await api(`/api/missions/${q}/report`);S.report=r.report;setError('report',null)}catch(e){S.report=null;setError('report',e)}}else{S.report=null;setError('report',null)}}
async function refresh(){if(S.loading)return;S.loading=true;try{S.error='';try{S.health=await api(API.health);S.connected=true;setError('health',null);if(!S.providerTouched&&['ollama','mock'].includes(S.health.provider))S.form.provider=S.health.provider}catch(e){S.connected=false;S.error=e.message;setError('health',e);render();return}
await Promise.all([loadSection('missions',API.missions,r=>S.missions=r.missions||[]),loadSection('agents',API.agents,r=>S.agents=r.agents||[]),loadSection('evidence',API.evidence+'?limit=500',r=>S.evidence=r.evidence||[]),loadSection('ledger',API.ledger+'?limit=200',r=>S.ledger=r.events||[]),loadSection('scenarios',API.scenarios,r=>S.scenarios=r.scenarios||[])]);
if(!S.selectedMission&&S.missions.length)S.selectedMission=S.missions[0].mission_id;if(S.selectedMission&&!S.missions.some(m=>m.mission_id===S.selectedMission))S.selectedMission=S.missions[0]?.mission_id||'';
await loadSelected();S.lastUpdated=new Date().toISOString();
}finally{S.loading=false;render()}}
function source(){return S.connected?`<span class="badge b-green">Live API · ${esc(fmt(S.lastUpdated))}</span>`:`<span class="badge b-amber">Disconnected · no demo data</span>`}
function errors(keys){const found=keys.map(k=>[k,S.errors[k]]).filter(x=>x[1]);return found.map(([k,v])=>`<div class="note bad"><b>${esc(k)}:</b> ${esc(v)}</div>`).join('')}
function empty(msg){return `<div class="empty">${esc(msg)}</div>`}
function table(items,heads,rowHtml,emptyText){return `<div class="scroll"><table><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${items.length?items.map(rowHtml).join(''):`<tr><td colspan="${heads.length}" class="muted">${esc(emptyText)}</td></tr>`}</tbody></table></div>`}
function selected(){return S.missions.find(m=>m.mission_id===S.selectedMission)}
function missionSelect(){return `<label>Selected mission<select id="mission-select"><option value="">Choose a mission</option>${S.missions.map(m=>`<option value="${esc(m.mission_id)}" ${m.mission_id===S.selectedMission?'selected':''}>${esc(m.mission_id)} · ${esc(m.status)}</option>`).join('')}</select></label>`}
function objectiveForm(){const f=S.form,models=S.models?.available_models||[];const modelSelect=(key,label)=>`<label>${label}<select id="model-${key}" ${f.provider!=='ollama'||!models.length?'disabled':''}>${models.map(m=>`<option value="${esc(m)}" ${m===f[key]?'selected':''}>${esc(m)}</option>`).join('')||'<option value="">Connect to Ollama to list models</option>'}</select></label>`;
return `<div class="card"><h2>Submit an investigation</h2>${errors(['models','submission'])}<div class="form"><label>Objective<textarea id="objective">${esc(f.objective)}</textarea></label><div class="form f2"><label>Provider<select id="provider"><option value="mock" ${f.provider==='mock'?'selected':''}>Deterministic mock (local, no Ollama)</option><option value="ollama" ${f.provider==='ollama'?'selected':''}>Ollama</option></select></label>${f.provider==='ollama'?modelSelect('supervisor','Supervisor model'):''}</div>
${f.provider==='ollama'?`<div class="grid g2">${modelSelect('research','Research Worker model')}${modelSelect('analysis','Analysis Worker model')}${modelSelect('verification','Verification Worker model')}</div>`:`<p class="faint" style="margin:0">Mock mode uses the deterministic provider. No Ollama request is made.</p>`}
<div class="row"><button class="btn p" data-act="submit-mission" ${S.connected&&!S.loading?'':'disabled'}>${S.loading?'Submitting…':'Start investigation'}</button><button class="btn" data-act="refresh" ${S.loading?'disabled':''}>Refresh live status</button></div></div></div>`}
function Vmission(){const m=selected(),d=S.detail||m||{},b=d.budgets||m?.budgets||{},tasks=S.tasks||[],pct=b.tool_calls_limit?Math.min(100,Math.round((b.tool_calls_used||0)/b.tool_calls_limit*100)):0;return `${!S.connected?`<div class="note bad">Live API unavailable. ${esc(S.error||'Connect to the local backend to load mission data.')}</div>`:''}${source()}${errors(['missions','detail','tasks','recovery'])}${objectiveForm()}<div class="grid g4"><div class="card kpi"><small>Missions</small><b>${S.missions.length}</b><span>persisted mission records</span></div><div class="card kpi"><small>Workers</small><b>${S.agents.length}</b><span>registered worker identities</span></div><div class="card kpi"><small>Evidence</small><b>${m?d.evidence_count??m.evidence_count??0:S.evidence.length}</b><span>persisted evidence items</span></div><div class="card kpi"><small>Receipts</small><b>${m?d.receipt_count??m.receipt_count??0:'—'}</b><span>Gateway ToolReceipts</span></div></div>
<div class="grid split"><div class="card"><h2>Missions ${badge(S.missions.length+' persisted')}</h2>${table(S.missions,['Mission','Status','Progress','Budget'],x=>`<tr class="pick ${x.mission_id===S.selectedMission?'sel':''}" data-mission="${esc(x.mission_id)}"><td><b class="mono">${esc(x.mission_id)}</b><div class="faint">${esc(x.objective)}</div></td><td>${badge(x.status)}</td><td>${x.completed_tasks}/${x.task_count} tasks · ${Math.round((x.progress||0)*100)}%</td><td class="mono">${x.budgets?.tool_calls_used||0} / ${x.budgets?.tool_calls_limit||0} calls</td></tr>`,'No missions have been submitted.')}</div>
<div class="card"><h2>Mission details</h2>${S.missions.length?missionSelect():empty('Submit an investigation to create a mission.')}${m?`<div class="stack" style="margin-top:12px"><div><b>${esc(d.objective||m.objective)}</b></div><div>Status ${badge(d.status||m.status)} · ${d.completed_tasks??m.completed_tasks??0}/${d.task_count??m.task_count??0} tasks complete</div><div class="mono wrap-any">${esc(m.mission_id)}</div><div class="row"><button class="btn d sm" data-act="cancel" ${['RUNNING','PARTIAL'].includes(String(d.status||m.status).toUpperCase())?'':'disabled'}>Cancel mission</button>${d.recovery?.resume_eligible?'<button class="btn sm" data-act="resume">Resume eligible mission</button>':''}</div>
<div class="faint">Token budget ${b.tokens_used||0} / ${b.tokens_limit||0} · Evidence bytes ${b.evidence_bytes_used||0} / ${b.evidence_bytes_limit||0}</div><div class="bar ${pct>=90?'warn':''}"><i style="width:${pct}%"></i></div></div>`:empty('Select a mission to see persisted progress and controls.')}</div></div>
${m?`<div class="card"><h2>Worker tasks</h2>${table(tasks,['Task','Worker role','State','Assignment'],x=>`<tr><td>${esc(x.task_id)}</td><td>${esc(x.worker_role)}</td><td>${badge(x.status)}</td><td class="mono">${esc(x.assignment?.assignment_id||'Not issued yet')}</td></tr>`,'Tasks will appear after the Supervisor creates the persisted mission plan.')}</div><div class="card"><h2>Final investigation report</h2>${errors(['report'])}${S.report?`<p>${esc(S.report.executive_summary||S.report.conclusion||'')}</p><div class="row">Provider ${badge(S.report.active_provider||'unknown')} · Confidence ${esc(S.report.confidence?.label||S.report.confidence||'not reported')}</div><details><summary>Full evidence-backed report</summary><pre>${esc(json(S.report))}</pre></details>`:empty(['COMPLETE','PARTIAL','FAILED'].includes(String(d.status||m.status).toUpperCase())?'No final report was persisted. Check mission status and audit events.':'Report becomes available when the mission finishes.')}</div>`:''}` }
function Vagents(){const tasks=S.tasks||[];return `${source()}${errors(['agents','tasks'])}<div class="card scroll"><h2>Registered workers</h2>${table(S.agents,['Worker','Role','Status','Mission'],a=>`<tr><td><b>${esc(a.name)}</b><div class="mono">${esc(a.worker_id)}</div></td><td>${esc(a.role)}</td><td>${badge(a.status,a.enabled?'':'b-red')}</td><td class="mono">${esc(a.mission_id||'—')}</td></tr>`,'No registered workers returned by the runtime.')}</div><div class="card"><h2>Selected mission assignments</h2>${missionSelect()}${table(tasks,['Task','Worker role','State','Error','Assignment'],t=>`<tr><td>${esc(t.task_id)}</td><td>${esc(t.worker_role)}</td><td>${badge(t.status)}</td><td>${esc(t.error||'—')}</td><td><pre>${esc(json(t.assignment||{}))}</pre></td></tr>`,'No tasks are persisted for this mission.')}</div>`}
function Vgateway(){const g=S.gateway;return `${source()}<div class="note">Read-only view. Browser clients cannot create tool requests or invoke adapters. Worker actions continue through signed assignments and the runtime-owned Secure Tool Gateway.</div>${errors(['gateway'])}${missionSelect()}${g?`<div class="grid g4"><div class="card kpi"><small>Authorization decisions</small><b>${g.decisions.length}</b></div><div class="card kpi"><small>Gateway requests</small><b>${g.requests.length}</b></div><div class="card kpi"><small>Executions</small><b>${g.executions.length}</b></div><div class="card kpi"><small>Signed receipts</small><b>${g.receipts.length}</b></div></div><div class="grid g2"><div class="card"><h2>Authorization decisions</h2>${g.decisions.length?g.decisions.map(e=>`<div class="card"><div class="row">${badge(e.event_payload?.outcome||e.event_payload?.decision||e.event_type)}<span class="mono">${esc(e.assignment_id||'—')}</span></div><pre>${esc(json(e.event_payload))}</pre></div>`).join(''):empty('No Gateway authorization decisions are recorded for this mission.')}</div><div class="card"><h2>Signed ToolReceipts</h2>${g.receipts.length?g.receipts.map(r=>`<details class="card"><summary>${esc(r.receipt_id)} · ${esc(r.execution_status)}</summary><pre>${esc(json(r))}</pre></details>`).join(''):empty('No signed ToolReceipts are recorded.')}</div></div><div class="card"><h2>Uncertain actions</h2>${g.uncertain_actions.length?`<pre>${esc(json(g.uncertain_actions))}</pre>`:empty('No UNCERTAIN actions are recorded.')}</div>`:empty('Select a mission to inspect persisted Gateway decisions and receipts.')}`}
function Vapprovals(){return `${source()}<div class="note">Approval decisions are unavailable in this runtime. No persistent human approval queue or decision service is configured, so the dashboard does not display fabricated approvals or accept decisions.</div><div class="card"><h2>Approval capability</h2>${empty('Unsupported by the active backend. Protected ACTION operations remain subject to Gateway approval enforcement; the dashboard cannot approve them.')}</div>`}
function Vevidence(){const records=S.evidence.filter(x=>!S.filter.evidence||JSON.stringify(x).toLowerCase().includes(S.filter.evidence.toLowerCase()));const rec=records.find(x=>x.item?.evidence_id===S.selectedEvidence);return `${source()}${errors(['evidence'])}<div class="grid split"><div class="card"><h2>Persisted evidence <input id="ev-filter" placeholder="Filter evidence" value="${esc(S.filter.evidence)}"></h2>${table(records,['Evidence','Source','Type','Mission','Integrity'],x=>{const i=x.item;return `<tr class="pick ${i.evidence_id===S.selectedEvidence?'sel':''}" data-evidence="${esc(i.evidence_id)}"><td class="mono">${esc(i.evidence_id)}</td><td>${esc(i.source)}</td><td>${esc(i.source_type)}</td><td class="mono">${esc(x.mission_id)}</td><td>${badge(x.integrity?.status)}</td></tr>`},'No persisted evidence is available.')}</div><div class="card"><h2>Evidence provenance</h2>${rec?`<div class="stack"><div><span class="faint">Integrity digest</span><div class="mono wrap-any">${esc(rec.item.integrity_digest)}</div></div><div>Source ${esc(rec.item.source)} · ${esc(rec.item.source_type)}</div><div>Collected ${fmt(rec.item.timestamp)} · Receipt <span class="mono">${esc(rec.item.receipt_id||'—')}</span></div><div class="faint">Mission ${esc(rec.mission_id)}</div><pre>${esc(json(rec.sanitized_view||rec.item.content))}</pre><details><summary>Provenance and links</summary><pre>${esc(json({provenance:rec.item.provenance,links:rec.links,claim_relations:rec.claim_relations,integrity:rec.integrity}))}</pre></details></div>`:empty('Select an evidence item to inspect its verified record and provenance.')}</div></div>`}
function Vaudit(){const events=S.ledger.filter(e=>!S.filter.ledger||e.event_type.includes(S.filter.ledger));const ev=events.find(e=>e.sequence_number===S.selectedEvent);return `${source()}${errors(['ledger','verify'])}<div class="card"><h2>Ledger verification <button class="btn p sm" data-act="verify-ledger" ${S.connected?'':'disabled'}>Verify actual ledger</button></h2>${S.verify?`<div class="note ${S.verify.status==='PASSED'?'ok':'bad'}">${esc(S.verify.status)} · ${esc(S.verify.chain_status)} · ${S.verify.events_checked} events checked</div><pre>${esc(json(S.verify))}</pre>`:empty('Run verification against the actual append-only audit ledger.')}</div><div class="grid split"><div class="card"><h2>Audit events <input id="ledger-filter" placeholder="Filter event type" value="${esc(S.filter.ledger)}"></h2>${table(events,['Sequence','Event','Mission','Time','Hash'],e=>`<tr class="pick ${e.sequence_number===S.selectedEvent?'sel':''}" data-event="${e.sequence_number}"><td>${e.sequence_number}</td><td>${esc(e.event_type)}</td><td class="mono">${esc(e.mission_id||'—')}</td><td>${fmt(e.timestamp)}</td><td class="mono">${short(e.event_hash)}</td></tr>`,'No audit events were returned.')}</div><div class="card"><h2>Event detail</h2>${ev?`<pre>${esc(json(ev))}</pre>`:empty('Select an actual ledger event.')}</div></div>`}
function Vsecurity(){return `${source()}<div class="note">The repository evaluation harness defines scenarios but does not provide a GAMIS-backed scenario runner. Definitions below are informational and are not simulated or reported as test results.</div>${errors(['scenarios'])}<div class="grid g2">${S.scenarios.map(s=>`<div class="card"><h2>${esc(s.scenario_id)} ${badge(s.runnable?'runnable':'definition only')}</h2><p class="muted">${esc(s.description||s.scenario_type||'')}</p><div class="faint">Type ${esc(s.scenario_type||'—')}</div></div>`).join('')||empty('No scenario definitions returned by the backend.')}</div>`}
function Vconn(){return `${source()}${errors(['health'])}<div class="card"><h2>Backend connection ${badge(S.connected?'connected':'not connected',S.connected?'b-green':'b-amber')}</h2><div class="form"><label>Local API base URL<input id="api-base" value="${esc(cfg.base)}" placeholder="http://127.0.0.1:8000"></label><div class="row"><button class="btn p" data-act="connect">Connect and load</button><button class="btn" data-act="refresh">Refresh</button></div><p class="faint" style="margin:0">The dashboard defaults to this backend’s same-origin URL. Start GAMIS locally, then open the dashboard from <span class="mono">http://127.0.0.1:8000/</span>. No bearer token is configured or required by this local adapter.</p>${S.health?`<pre>${esc(json(S.health))}</pre>`:''}</div></div><div class="card"><h2>Connected API contract</h2>${table(Object.entries({health:'GET /health',missions:'GET/POST /api/missions',mission:'GET /api/missions/{id}',report:'GET /api/missions/{id}/report',tasks:'GET /api/missions/{id}/tasks',agents:'GET /api/agents',evidence:'GET /api/evidence',gateway:'GET /api/missions/{id}/gateway',receipts:'GET /api/missions/{id}/receipts',audit:'GET /api/ledger',verify:'GET /api/ledger/verify',recovery:'GET /api/missions/{id}/recovery',approvals:'Unsupported: no approval queue',directGateway:'Unsupported: browser Gateway execution disabled'}),['Feature','Backend implementation'],x=>`<tr><td>${esc(x[0])}</td><td class="mono">${esc(x[1])}</td></tr>`,'No routes documented.')}</div>`}
const V={mission:Vmission,agents:Vagents,gateway:Vgateway,approvals:Vapprovals,evidence:Vevidence,audit:Vaudit,security:Vsecurity,conn:Vconn};
function render(){const p=PAGES.find(x=>x[0]===S.page)||PAGES[0];$('#nav').innerHTML=PAGES.map(x=>`<button class="${x[0]===S.page?'on':''}" data-go="${x[0]}">${esc(x[1])}</button>`).join('');$('#h1').textContent=p[1];$('#h1p').textContent=p[2];$('#topbar').innerHTML=`${source()}<button class="btn sm" data-act="refresh" ${S.loading?'disabled':''}>Refresh</button>`;$('#sf-title').innerHTML=`<span class="dot ${S.connected?'live':''}"></span>${S.connected?'Backend connected':'No live connection'}`;$('#sf-sub').textContent=cfg.base;$('#view').innerHTML=(S.loading?'<div class="note">Loading live backend data…</div>':'')+(V[S.page]||V.mission)();document.title='GAMIS · '+p[1]}
function goto(page){location.hash='/'+page}
async function submitMission(){const objective=S.form.objective.trim();if(objective.length<8){setError('submission',new Error('Enter an investigation objective of at least 8 characters.'));render();return}const body={objective,provider:S.form.provider};if(body.provider==='ollama'){for(const k of ['supervisor','research','analysis','verification'])if(S.form[k])body[k==='supervisor'?'supervisor_model':k==='research'?'research_model':k==='analysis'?'analysis_model':'verification_model']=S.form[k]}
try{setError('submission',null);S.loading=true;render();const result=await api(API.missions,{method:'POST',body});S.selectedMission=result.mission_id;S.loading=false;await refresh();toast(`Mission ${result.mission_id} submitted (${result.provider}).`)}catch(e){setError('submission',e);render();toast('Mission submission failed: '+e.message)}finally{S.loading=false;render()}}
function toast(message){const node=$('#toast');node.textContent=message;node.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>{node.style.display='none'},5000)}
document.addEventListener('click',async ev=>{const t=ev.target.closest('[data-go],[data-act],[data-mission],[data-evidence],[data-event]');if(!t)return;const d=t.dataset;if(d.go){goto(d.go);return}if(d.mission){S.selectedMission=d.mission;await loadSelected();render();return}if(d.evidence){S.selectedEvidence=d.evidence;render();return}if(d.event){S.selectedEvent=Number(d.event);render();return}
if(d.act==='refresh'){await refresh();return}if(d.act==='connect'){const input=$('#api-base');cfg.base=(input?.value||'').trim().replace(/\/+$/,'');try{localStorage.setItem('gamis_cfg',JSON.stringify(cfg))}catch(_){}await refresh();return}
if(d.act==='submit-mission'){await submitMission();return}if(d.act==='cancel'){if(!S.selectedMission)return;try{await api(`/api/missions/${encodeURIComponent(S.selectedMission)}/cancel`,{method:'POST'});await refresh();toast('Cancellation requested by the runtime.')}catch(e){toast('Cancel rejected: '+e.message)}return}
if(d.act==='resume'){try{await api(`/api/missions/${encodeURIComponent(S.selectedMission)}/resume`,{method:'POST'});await refresh();toast('Resume request accepted for runtime validation.')}catch(e){toast('Resume rejected: '+e.message)}return}
if(d.act==='verify-ledger'){try{S.verify=await api(API.verify);setError('verify',null)}catch(e){setError('verify',e);S.verify=null}render();return}});
document.addEventListener('input',e=>{if(e.target.id==='objective')S.form.objective=e.target.value;if(e.target.id==='ev-filter'){S.filter.evidence=e.target.value;const pos=e.target.selectionStart;render();$('#ev-filter')?.focus();$('#ev-filter')?.setSelectionRange(pos,pos)}if(e.target.id==='ledger-filter'){S.filter.ledger=e.target.value;const pos=e.target.selectionStart;render();$('#ledger-filter')?.focus();$('#ledger-filter')?.setSelectionRange(pos,pos)}});
document.addEventListener('change',async e=>{if(e.target.id==='mission-select'){S.selectedMission=e.target.value;await loadSelected();render()}if(e.target.id==='provider'){S.providerTouched=true;S.form.provider=e.target.value;S.form.supervisor=S.form.research=S.form.analysis=S.form.verification='';await loadModels()}if(e.target.id?.startsWith('model-'))S.form[e.target.id.slice(6)]=e.target.value});
function route(){const p=(location.hash.replace('#/','')||'mission');S.page=PAGES.some(x=>x[0]===p)?p:'mission';render()}addEventListener('hashchange',route);
(async()=>{route();await refresh();if(S.connected)await loadModels();setInterval(()=>refresh(),5000)})();
</script>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
